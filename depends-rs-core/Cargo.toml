[package]
name = "depends-rs-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Syntax, shape metadata, and expansion planning for depends-rs"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/yuygfgg/depends-rs"
documentation = "https://docs.rs/depends-rs-core"
keywords = ["borrowing", "lifetimes", "proc-macro", "rust"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns"]

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }

[lints]
workspace = true

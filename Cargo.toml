[package]
name = "depends-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Dependency-oriented lifetime elaboration for Rust"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/yuygfgg/depends-rs"
documentation = "https://docs.rs/depends-rs"
keywords = ["borrowing", "lifetimes", "proc-macro", "rust"]
categories = ["development-tools::procedural-macro-helpers", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
depends-core = { path = "depends-core", version = "0.1.0" }

[workspace]
resolver = "2"
members = [
    "depends-core",
    "tests/fixtures/model",
    "tests/fixtures/facade",
    "tests/fixtures/consumer",
    "tests/fixtures/renamed",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
